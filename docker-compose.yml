# Environnement de développement local — Comité des Fêtes
#
# Site UNIQUE (comme en production) : un seul serveur web + une seule base MySQL,
# plus phpMyAdmin. L'environnement applicatif rendu (thème + bandeau) est piloté
# par la variable CDF_ENV (voir .env) ; par défaut « local » (thème violet + badge).
#
#   Démarrage :  docker compose up -d --build
#   Accès :
#     - Site       → http://localhost:8080
#     - phpMyAdmin → http://localhost:8082   (serveur db, login root / root)
#
# Les ports, l'UID/GID et CDF_ENV sont paramétrables dans le fichier .env.

services:
  # ---------- Serveur web ----------
  web:
    image: cms-web:local
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/www
      # Environnement applicatif : local (défaut) | test | recette | prod.
      # Surchargeable dans .env pour prévisualiser un thème sans changer de code.
      CDF_ENV: ${CDF_ENV:-local}
      # Identifiants BDD injectés (aucun fichier config_secrets.php requis en local).
      CDF_DB_HOST: db
      CDF_DB_NAME: comitefetes
      CDF_DB_USER: cdf
      CDF_DB_PASS: cdf
    volumes:
      - .:/var/www/html
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - db
    restart: unless-stopped

  # ---------- Base de données ----------
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comitefetes
      MYSQL_USER: cdf
      MYSQL_PASSWORD: cdf
    volumes:
      - ./docker/data:/var/lib/mysql
      # Déposer ici l'export SQL de la base (voir docker/initdb/README.md).
      - ./docker/initdb:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-3307}:3306"
    restart: unless-stopped

  # ---------- Administration de la base ----------
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8082}:80"
    depends_on:
      - db
    restart: unless-stopped

